services:
  api:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configure DATABASE_URL no arquivo .env}
      DB_POOL_MIN: ${DB_POOL_MIN:-1}
      DB_POOL_MAX: ${DB_POOL_MAX:-5}
      SECRET_KEY: ${SECRET_KEY:-desenvolvimento-local-troque-em-producao}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      PIX_KEY: ${PIX_KEY:-11999999999}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
    ports:
      - "8000:8000"
